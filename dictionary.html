<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictionary</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
</head>
<body>
  <main class="app app-dictionary">
    <nav class="page-nav page-nav-split dictionary-page-nav">
      <a class="page-nav-link" href="index.html">Back to Generator</a>
      <a class="page-nav-link" href="flashcards.html">Flashcards</a>
      <a class="page-nav-link" href="meanings.html">Meanings needed</a>
    </nav>

    <h1>Dictionary</h1>

    <section class="dictionary-section" aria-live="polite">
      <div class="dictionary-search">
        <label for="dictionarySearch">Search words and definitions</label>
        <input id="dictionarySearch" type="search" placeholder="Search spelling or meaning…" autocomplete="off" spellcheck="false" aria-controls="dictionaryList">
      </div>
      <div class="dictionary-toolbar">
        <div class="dictionary-toolbar-group dictionary-toolbar-group-left">
          <div id="dictionaryFilters" class="dictionary-filters" role="group" aria-label="Dictionary filters">
            <button type="button" class="dictionary-filter-btn is-active" data-filter="defined" aria-pressed="true">
              <span class="dictionary-filter-label">Defined</span>
              <span class="dictionary-filter-count" data-filter-count="defined">0</span>
            </button>
            <button type="button" class="dictionary-filter-btn" data-filter="candidate" aria-pressed="false">
              Candidates
              <span class="dictionary-filter-count" data-filter-count="candidate">0</span>
            </button>
            <button type="button" class="dictionary-filter-btn" data-filter="undefined" aria-pressed="false">
              <span class="dictionary-filter-label">Undefined</span>
              <span class="dictionary-filter-count" data-filter-count="undefined">0</span>
            </button>
            <button type="button" class="dictionary-filter-btn" data-filter="all" aria-pressed="false">
              <span class="dictionary-filter-label">All</span>
              <span class="dictionary-filter-count" data-filter-count="all">0</span>
            </button>
          </div>
          <button
            id="dictionaryMyHeartsToggle"
            class="dictionary-toggle-btn"
            type="button"
            aria-pressed="false"
          >
            My Hearts
          </button>
        </div>
        <div class="dictionary-toolbar-group dictionary-toolbar-group-right">
          <button id="dictionaryRetry" class="dictionary-toggle-btn dictionary-refresh-btn" type="button" aria-label="Refresh dictionary" title="Refresh dictionary" aria-controls="dictionaryList">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M20 7v5h-5M4 17v-5h5" />
              <path d="M6.1 6.1A8 8 0 0 1 19.5 10M4.5 14A8 8 0 0 0 17.9 17.9" />
            </svg>
          </button>
          <button
            id="dictionaryAddWordBtn"
            class="dictionary-toggle-btn"
            type="button"
            aria-expanded="false"
          >
            Add Word
          </button>
        </div>
      </div>
      <section id="dictionaryComposer" class="dictionary-composer is-hidden" aria-label="Add a manual dictionary word"></section>
      <p id="dictionaryStatus" class="dictionary-status" role="status">Loading dictionary...</p>
      <p id="dictionarySyncStatus" class="dictionary-status" role="status"></p>
      <ol id="dictionaryList" class="dictionary-list"></ol>
      <div id="dictionarySentinel" class="dictionary-sentinel" aria-hidden="true"></div>
    </section>
  </main>

  <script type="application/x-protected-script" data-protected-src="aws-config.js"></script>
  <script type="application/x-protected-script" data-protected-src="https://sdk.amazonaws.com/js/aws-sdk-2.1692.0.min.js"></script>
  <script type="application/x-protected-script" data-protected-src="shared.js"></script>
  <script type="application/x-protected-script" data-protected-src="dictionary-cache.js"></script>
  <script type="application/x-protected-script" data-protected-src="rules-config.js"></script>
  <script type="application/x-protected-script" data-protected-src="database-settings.js" data-protected-ready="SECRET_RULES_READY"></script>
  <script type="application/x-protected-script" data-protected-src="definition-workflow.js"></script>
  <script type="application/x-protected-script" data-protected-src="word-notes.js"></script>
  <script type="application/x-protected-script" data-protected-src="cooperative-refresh.js"></script>
  <script type="application/x-protected-script" data-protected-src="meaning-requests.js"></script>
  <script type="application/x-protected-script" data-protected-src="definition-picker.js"></script>
  <script type="application/x-protected-script" data-protected-src="word-relationships.js"></script>
  <script type="application/x-protected-script" data-protected-src="dictionary.js"></script>
</body>
</html>
