<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Generator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
</head>
<body>
  <main class="app">
    <nav class="page-nav page-nav-split">
      <div class="page-nav-group">
        <a class="page-nav-link" href="settings.html">Settings</a>
      </div>
      <div class="page-nav-group page-nav-group-right">
        <a class="page-nav-link" href="dictionary.html">Dictionary</a>
        <a class="page-nav-link" href="meanings.html">Meanings needed</a>
      </div>
    </nav>

    <h1>Language Word Generator</h1>

    <section class="controls" aria-label="Generation settings">
      <div class="controls-left">
        <div class="control-item">
          <label for="minSyllables">Min syllables</label>
          <input id="minSyllables" type="number" min="1" max="12" value="1">
        </div>
        <div class="control-item">
          <label for="maxSyllables">Max syllables</label>
          <input id="maxSyllables" type="number" min="1" max="12" value="3">
        </div>
      </div>
    </section>

    <details class="prefix-options">
      <summary>Constraints</summary>
      <label for="wordPrefix">Starts with (optional)</label>
      <input id="wordPrefix" type="text" autocomplete="off" spellcheck="false" aria-describedby="prefixStatus">
      <p id="prefixStatus" role="status" aria-live="polite"></p>
      <label for="wordSuffix">Ends with (optional)</label>
      <input id="wordSuffix" type="text" autocomplete="off" spellcheck="false" aria-describedby="prefixStatus">
      <fieldset class="normalization-controls">
        <legend>Normalize</legend>
        <p>Favor underrepresented symbols in saved words. These weights bias symbol choices, not the exact distribution of complete words.</p>
        <div id="normalizationRows"></div>
        <p id="normalizationStatus" role="status" aria-live="polite"></p>
        <button id="normalizationRetry" type="button" hidden>Retry dictionary load</button>
      </fieldset>
    </details>
    <button id="generateBtn" class="generate-btn" type="button">Generate</button>
    <p id="generationStatus" class="generation-status is-hidden" role="status" aria-live="polite"></p>

    <section class="results-section" aria-live="polite">
      <div class="results-header">
        <h2>Generated Words</h2>
        <button id="clearAllBtn" class="clear-all-btn" type="button">clear all</button>
      </div>
      <ol id="results" class="results-list"></ol>
    </section>
  </main>

  <script type="application/x-protected-script" data-protected-src="aws-config.js"></script>
  <script type="application/x-protected-script" data-protected-src="https://sdk.amazonaws.com/js/aws-sdk-2.1692.0.min.js"></script>
  <script type="application/x-protected-script" data-protected-src="shared.js"></script>
  <script type="application/x-protected-script" data-protected-src="rules-config.js"></script>
  <script type="application/x-protected-script" data-protected-src="database-settings.js" data-protected-ready="SECRET_RULES_READY"></script>
  <script type="application/x-protected-script" data-protected-src="prefix-generator.js"></script>
  <script type="application/x-protected-script" data-protected-src="definition-workflow.js"></script>
  <script type="application/x-protected-script" data-protected-src="cooperative-refresh.js"></script>
  <script type="application/x-protected-script" data-protected-src="meaning-requests.js"></script>
  <script type="application/x-protected-script" data-protected-src="symbol-analytics.js"></script>
  <script type="application/x-protected-script" data-protected-src="generator-normalization.js"></script>
  <script type="application/x-protected-script" data-protected-src="generator-constraints.js"></script>
  <script type="application/x-protected-script" data-protected-src="script.js"></script>
</body>
</html>
